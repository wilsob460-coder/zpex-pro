<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Dono - ZPEX.PRO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            margin-top: 40px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .result-box {
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            word-break: break-all;
            display: none;
            text-align: left;
        }
        .result-box a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }
        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Painel do Dono</h1>
        <p>Cole abaixo o link original (Mega, Mediafire, YouTube, etc.) para gerar o seu link monetizado oficial:</p>
        
        <input type="text" id="target-url" placeholder="https://exemplo.com/seu-arquivo">
        <button class="btn" onclick="generateLink()">Gerar Link Monetizado</button>

        <div class="result-box" id="result-box">
            <p style="margin-bottom: 8px; color: #cbd5e1;">O seu link pronto para partilhar:</p>
            <a href="#" id="shortened-link-output" target="_blank"></a>
        </div>
    </div>

    <footer>
        &copy; 2026 ZPEX.PRO - Painel Administrativo
    </footer>

    <script>
        function generateLink() {
            let urlInput = document.getElementById('target-url').value.trim();
            if (!urlInput) {
                alert('Por favor, insira um link válido!');
                return;
            }

            if (!urlInput.startsWith('http://') && !urlInput.startsWith('https://')) {
                urlInput = 'https://' + urlInput;
            }

            // Cria o link apontando para a raiz do site + hash codificado
            const domainBase = window.location.origin + "/";
            const finalLink = domainBase + '#' + encodeURIComponent(urlInput);

            const resultBox = document.getElementById('result-box');
            const linkOutput = document.getElementById('shortened-link-output');
            
            linkOutput.href = finalLink;
            linkOutput.innerText = finalLink;
            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
