<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZPEX.PRO - A carregar conteúdo...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            margin-top: 40px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .counter-box {
            font-size: 42px;
            font-weight: bold;
            color: #38bdf8;
            margin: 20px 0;
        }
        .ad-container {
            margin: 25px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px dashed #334155;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: none;
            text-decoration: none;
        }
        .btn:hover {
            background: #059669;
        }
        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>

    <!-- Adsterra Scripts (Popunder / Social Bar) -->
    <!-- Cole os scripts globais da Adsterra aqui se necessário -->
</head>
<body>

    <div class="container">
        <h1>A preparar o seu destino...</h1>
        <p>Por favor, aguarde alguns segundos enquanto o link é verificado.</p>
        
        <div class="counter-box" id="countdown">10</div>

        <!-- Espaço para o Banner 300x250 Adsterra -->
        <div class="ad-container" id="ad-slot">
            <span style="color: #64748b; font-size: 13px;">Carregando anúncios...</span>
            <!-- Cole o código do Banner Adsterra 300x250 aqui dentro -->
        </div>

        <a href="#" class="btn" id="go-btn" onclick="redirectToDestination(event)">Acessar Link Agora</a>
    </div>

    <footer>
        &copy; 2026 ZPEX.PRO - Todos os direitos reservados.
    </footer>

    <script>
        let originalDestination = "";

        window.onload = function() {
            const hash = window.location.hash.substring(1);
            if (hash && hash.startsWith('http')) {
                originalDestination = decodeURIComponent(hash);
                startCountdown();
            } else {
                document.querySelector('.container').innerHTML = `
                    <h1>ZPEX.PRO</h1>
                    <p style="margin-top:15px;">Plataforma de encurtamento profissional.</p>
                `;
            }
        }

        let timeLeft = 10;
        function startCountdown() {
            const timerElement = document.getElementById('countdown');
            const goBtn = document.getElementById('go-btn');

            let timer = setInterval(() => {
                timeLeft--;
                timerElement.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timerElement.style.display = 'none';
                    document.querySelector('p').innerText = 'O seu link está pronto!';
                    goBtn.style.display = 'block';
                }
            }, 1000);
        }

        function redirectToDestination(e) {
            e.preventDefault();
            if (originalDestination) {
                window.location.href = originalDestination;
            }
        }
    </script>
</body>
</html>
